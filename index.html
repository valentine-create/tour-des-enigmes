<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Tour des Énigmes — Prototype</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17152a;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#game{width:100vw;height:100vh;position:relative;background:linear-gradient(#b9e8ff 0 38%,#7fcf8b 38% 100%);overflow:hidden}
#sky{position:absolute;inset:0 0 62% 0;background:linear-gradient(#8bd7ff,#dff8ff)}
.cloud{position:absolute;background:white;border-radius:50%;width:130px;height:45px;opacity:.75}
.cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%}
.cloud:before{width:65px;height:65px;left:25px;top:-30px}.cloud:after{width:75px;height:75px;right:15px;top:-35px}
#tower{position:absolute;left:7%;right:7%;top:12%;bottom:0;background:#d7c3a3;border:12px solid #725b50;border-bottom:0;box-shadow:inset 0 0 0 5px #a88770}
#room{position:absolute;inset:0;background:linear-gradient(90deg,#eadbc2,#f8edda 50%,#ddc9a9);overflow:hidden}
.window{position:absolute;top:7%;left:43%;width:18%;height:30%;background:#8dd8ff;border:9px solid #745b50;border-radius:10px}
.window:after{content:"☀️";font-size:42px;position:absolute;right:10%;top:10%}
.floor{position:absolute;left:0;right:0;bottom:0;height:18%;background:#9a735b;border-top:8px solid #705344}
.door{position:absolute;right:4%;bottom:18%;width:12%;height:43%;background:#68463c;border:9px solid #4d332e;border-radius:8px 8px 0 0}
.door span{position:absolute;right:15%;top:52%;font-size:20px}
.object{position:absolute;cursor:pointer;user-select:none;transition:.15s;z-index:5}
.object:hover{transform:scale(1.08)}
#table{left:34%;bottom:20%;width:20%;height:10%;background:#7c513b;border-radius:8px}
#table:before{content:"";position:absolute;left:10%;right:10%;top:-55%;height:55%;background:#9a6548;border-radius:6px}
#book{left:40%;bottom:28%;font-size:35px}
#plant{left:13%;bottom:18%;font-size:60px}
#painting{left:6%;top:14%;font-size:55px}
#chest{left:69%;bottom:18%;font-size:60px}
.character{position:absolute;z-index:7;cursor:pointer;text-align:center}
.character .body{font-size:65px;filter:drop-shadow(0 4px 2px #0004)}
.character .name{background:#fff;color:#4d3550;padding:4px 8px;border-radius:12px;font-size:13px;font-weight:bold}
#gardener{left:20%;bottom:18%}
#traveler{left:57%;bottom:18%}
#player{position:absolute;z-index:8;left:47%;bottom:18%;font-size:65px;user-select:none;transition:left .08s}
#hud{position:absolute;z-index:20;left:15px;right:15px;top:15px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.panel{pointer-events:auto;background:#ffffffdd;color:#3c2c45;border:2px solid #fff;border-radius:15px;padding:10px 14px;box-shadow:0 5px 18px #0003}
#title{font-weight:bold;font-size:18px}#hint{font-size:13px;margin-top:3px}
#inventory{min-width:150px}
#message{position:absolute;z-index:30;left:50%;bottom:4%;transform:translateX(-50%);width:min(560px,90vw);background:#fff;color:#38273f;border-radius:18px;padding:16px;display:none;box-shadow:0 8px 30px #0005}
#message b{color:#8d4b8e}
#modal{position:absolute;z-index:40;inset:0;background:#0008;display:none;align-items:center;justify-content:center}
.box{width:min(420px,90vw);background:#fff;color:#34243d;border-radius:20px;padding:24px;text-align:center;box-shadow:0 10px 40px #0007}
.code{display:flex;gap:8px;justify-content:center;margin:15px}
.code input{width:55px;padding:10px;text-align:center;font-size:24px;border:2px solid #c99dcc;border-radius:10px}
button{border:0;border-radius:12px;padding:10px 16px;background:#b76db6;color:#fff;font-weight:bold;cursor:pointer}
#controls{position:absolute;z-index:25;left:15px;bottom:15px;display:flex;gap:8px}
#controls button{font-size:20px;background:#ffffffdd;color:#5a3b5f}
@media(max-width:700px){#tower{left:2%;right:2%}.window{left:38%;width:25%}#player{font-size:50px}.character .body{font-size:50px}}
</style>
</head>
<body>
<div id="game">
  <div id="sky"><div class="cloud" style="left:12%;top:18%"></div><div class="cloud" style="right:12%;top:28%"></div></div>
  <div id="tower">
    <div id="room">
      <div class="window"></div>
      <div id="painting" class="object" data-text="Un tableau représentant trois étoiles. La troisième étoile semble légèrement rayée.">🖼️</div>
      <div id="plant" class="object" data-text="Une plante magnifique. Une petite clé est cachée derrière son pot...">🌿</div>
      <div id="table"></div>
      <div id="book" class="object" data-text="Un vieux livre. La page ouverte parle d'une cascade et indique : « Cherche là où l'eau tombe sans pluie. »">📖</div>
      <div id="chest" class="object" data-chest="true">🧰</div>
      <div class="door" id="door"><span>🔒</span></div>
      <div id="gardener" class="character">
        <div class="body">🧑‍🌾</div><div class="name">Milo</div>
      </div>
      <div id="traveler" class="character">
        <div class="body">🧙</div><div class="name">Lina</div>
      </div>
      <div id="player">🧍</div>
      <div class="floor"></div>
    </div>
  </div>

  <div id="hud">
    <div class="panel"><div id="title">🏰 La Tour des Énigmes — Étage 1</div><div id="hint">Explore la pièce et clique sur ce qui semble intéressant.</div></div>
    <div class="panel" id="inventory">🎒 Inventaire : <span id="items">vide</span></div>
  </div>

  <div id="controls">
    <button onclick="move(-1)">◀</button>
    <button onclick="move(1)">▶</button>
  </div>

  <div id="message"></div>

  <div id="modal">
    <div class="box">
      <h2>🔐 Le coffre</h2>
      <p>Le coffre possède une serrure à 3 chiffres.</p>
      <p>Indice : <b>« Les trois étoiles du tableau te montrent le chemin. »</b></p>
      <div class="code">
        <input id="c1" maxlength="1" inputmode="numeric">
        <input id="c2" maxlength="1" inputmode="numeric">
        <input id="c3" maxlength="1" inputmode="numeric">
      </div>
      <button onclick="checkCode()">Ouvrir</button>
      <button onclick="closeModal()" style="background:#777">Fermer</button>
      <p id="result"></p>
    </div>
  </div>
</div>

<script>
let playerX=47;
let items=[];
const player=document.getElementById('player');
const message=document.getElementById('message');
const inventory=document.getElementById('items');

function move(dir){
  playerX=Math.max(8,Math.min(84,playerX+dir*4));
  player.style.left=playerX+'%';
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='q') move(-1);
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d') move(1);
});

function say(text){
  message.innerHTML=text;
  message.style.display='block';
  clearTimeout(window.msgTimer);
  window.msgTimer=setTimeout(()=>message.style.display='none',5000);
}

document.querySelectorAll('.object').forEach(o=>{
  o.addEventListener('click',()=>{
    if(o.dataset.chest){
      if(items.includes('clé')){
        say('🔓 La clé ouvre le coffre ! Mais il reste une serrure à code...');
      }
      document.getElementById('modal').style.display='flex';
    }else{
      say('🔎 '+o.dataset.text);
    }
  });
});

document.getElementById('plant').addEventListener('dblclick',()=>{
  if(!items.includes('clé')){
    items.push('clé');
    inventory.textContent=items.join(', ');
    say('🗝️ Tu trouves une petite clé cachée derrière le pot !');
  }
});

document.getElementById('gardener').addEventListener('click',()=>{
  say('<b>Milo :</b> « J’ai perdu une petite clé… Je crois qu’elle est près de ma plante. Mais chut, je ne t’ai rien dit ! »');
});
document.getElementById('traveler').addEventListener('click',()=>{
  say('<b>Lina :</b> « Dans cette tour, les objets parlent parfois plus que les personnes. Observe tout. »');
});
document.getElementById('door').addEventListener('click',()=>{
  say('🚪 La porte est verrouillée. Tu dois résoudre l’énigme du coffre.');
});

function closeModal(){document.getElementById('modal').style.display='none';document.getElementById('result').textContent='';}
function checkCode(){
  const code=document.getElementById('c1').value+document.getElementById('c2').value+document.getElementById('c3').value;
  const result=document.getElementById('result');
  if(code==='319'){
    result.textContent='✨ Bravo ! Le coffre s’ouvre et contient une clé dorée. La porte de l’étage suivant s’ouvre !';
    result.style.color='green';
    document.getElementById('door').innerHTML='<span>🚪✨</span>';
    document.getElementById('hint').textContent='Étage terminé ! Dans la vraie version, tu pourrais maintenant monter.';
  }else{
    result.textContent='❌ Ce n’est pas le bon code. Observe encore les indices.';
    result.style.color='crimson';
  }
}
</script>
</body>
</html>
